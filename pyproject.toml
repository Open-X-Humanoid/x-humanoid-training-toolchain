[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "xhum"
version = "0.1.0"
description = "TienKung Humanoid Training & Deployment Toolchain, built on LeRobot"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [
    { name = "Open-X-Humanoid" },
]
keywords = ["robotics", "humanoid", "lerobot", "ros2", "deployment"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # lerobot is installed separately from the submodule: pip install -e ./lerobot
    "h5py>=3.10.0",
    "opencv-python-headless>=4.9.0",
    "numpy>=2.0.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
# ROS2 packages are provided by the system ROS2 installation, not pip
ros2 = []
dev = ["pre-commit>=3.7.0", "pytest>=8.1.0", "ruff>=0.4.0"]

[project.scripts]
xhum-convert = "xhum.convert.hdf5_to_lerobot:main"
xhum-deploy = "xhum.deploy.ros2_deploy:main"
xhum-train-multi = "xhum.train.train_multi:main"

[project.urls]
homepage = "https://github.com/Open-X-Humanoid/x-humanoid-training-toolchain"
upstream-lerobot = "https://github.com/huggingface/lerobot"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["xhum", "lerobot"]
